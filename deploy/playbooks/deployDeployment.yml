- name: Deploy application using k8s module (idempotent)
  hosts: k8s-master
  become: true

  vars:
    app_name: gfgdeployment
    namespace: default

  tasks:
    - name: Ensure deployment manifest is present from template
      template:
        src: templates/gfg-deployment.yml.j2
        dest: /tmp/gfg-deployment.yml

    - name: Apply the Kubernetes manifest (create/update)
      k8s:
        state: present
        src: /tmp/gfg-deployment.yml

    - name: Restart deployment if image changed (trigger rollout)
      k8s:
        kind: Deployment
        namespace: "{{ namespace }}"
        name: "{{ app_name }}"
        state: restarted
      when: false