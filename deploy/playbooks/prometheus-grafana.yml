---
- name: Install Helm and Prometheus
  hosts: k8s-master  # Run tasks on all hosts
  become: true  # Run tasks with sudo

  tasks:
    - name: Ensure community.kubernetes collection is installed (best-effort)
      ansible.builtin.command: ansible-galaxy collection install community.kubernetes
      changed_when: false
      failed_when: false

    - name: Ensure socat is installed
      ansible.builtin.package:
        name: socat
        state: present

    - name: Apply PV manifests (if present)
      k8s:
        state: present
        src: "{{ item }}"
      loop:
        - ../permissions-pv.yml
        - ../prometheus-server1pv.yml
        - ../prometheus-serverpv.yml
      register: pv_apply
      ignore_errors: true

    - name: Add prometheus-community helm repo using shell fallback
      ansible.builtin.command: helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
      register: helm_add_prom
      failed_when: false

    - name: Update helm repos (fallback)
      ansible.builtin.command: helm repo update
      failed_when: false

    - name: Install Prometheus using Helm (community.kubernetes.helm)
      community.kubernetes.helm:
        name: prometheus
        chart_ref: prometheus-community/prometheus
        release_namespace: monitoring
        create_namespace: yes
        wait: yes
        timeout: 600
      register: prometheus_release
      failed_when: prometheus_release is failed

    - name: Ensure prometheus service is present and exposed (NodePort)
      k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Service
          metadata:
            name: prometheus-server-ext
            namespace: monitoring
          spec:
            selector:
              app: prometheus
            type: NodePort
            ports:
              - port: 9090
                targetPort: 9090
      register: prometheus_svc
      failed_when: false

    - name: Add grafana helm repo (fallback)
      ansible.builtin.command: helm repo add grafana https://grafana.github.io/helm-charts
      failed_when: false

    - name: Install Grafana using Helm
      community.kubernetes.helm:
        name: grafana
        chart_ref: grafana/grafana
        release_namespace: monitoring
        create_namespace: yes
        wait: yes
        timeout: 600
      register: grafana_release
      failed_when: grafana_release is failed

    - name: Ensure grafana service exposed (NodePort)
      k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Service
          metadata:
            name: grafana-ext
            namespace: monitoring
          spec:
            selector:
              app.kubernetes.io/name: grafana
            type: NodePort
            ports:
              - port: 3000
                targetPort: 3000
      failed_when: false