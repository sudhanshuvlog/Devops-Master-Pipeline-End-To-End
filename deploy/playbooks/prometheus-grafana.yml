- name: Install Helm and Prometheus
  hosts: k8s-master
  become: true
  vars:
    ansible_python_interpreter: /usr/bin/python3

  tasks:
    - name: Ensure community.kubernetes collection is installed on controller (best-effort)
      delegate_to: localhost
      become: false
      ansible.builtin.command: ansible-galaxy collection install community.kubernetes
      changed_when: false
      failed_when: false
    - name: Ensure socat and Python dependencies are installed
      ansible.builtin.package:
        name:
          - socat
          - python3-pip
          - python3-setuptools
        state: present

    - name: Check whether Helm is already installed
      ansible.builtin.command: helm version --short
      register: helm_check
      changed_when: false
      failed_when: false

    - name: Download Helm
      ansible.builtin.get_url:
        url: https://get.helm.sh/helm-v4.3.1-linux-amd64.tar.gz
        dest: /tmp/helm-v4.3.1-linux-amd64.tar.gz
      when: helm_check.rc != 0

    - name: Create Helm extraction directory
      ansible.builtin.file:
        path: /tmp/helm
        state: directory
      when: helm_check.rc != 0

    - name: Extract Helm
      ansible.builtin.unarchive:
        src: /tmp/helm-v4.3.1-linux-amd64.tar.gz
        dest: /tmp/helm
        remote_src: true
      when: helm_check.rc != 0

    - name: Install Helm binary
      ansible.builtin.copy:
        src: /tmp/helm/linux-amd64/helm
        dest: /usr/local/bin/helm
        remote_src: true
        mode: '0755'
      when: helm_check.rc != 0

    - name: Install Python Kubernetes client
      ansible.builtin.pip:
        name: kubernetes
        executable: pip3

    - name: Copy Kubernetes PV manifests
      ansible.builtin.copy:
        src: "{{ item }}"
        dest: "/{{ item | basename }}"
      loop:
        - ../permissions-pv.yml
        - ../prometheus-server1pv.yml
        - ../prometheus-serverpv.yml

    - name: Ensure monitoring namespace exists
      ansible.builtin.command: kubectl create namespace monitoring
      register: namespace_result
      changed_when: namespace_result.rc == 0
      failed_when:
        - namespace_result.rc != 0
        - "'AlreadyExists' not in namespace_result.stderr"

    - name: Apply PV manifests
      ansible.builtin.command: "kubectl apply -f {{ item }}"
      loop:
        - /permissions-pv.yml
        - /prometheus-server1pv.yml
        - /prometheus-serverpv.yml
      register: pv_result
      changed_when: "'unchanged' not in pv_result.stdout"

    - name: Add Prometheus Helm repository
      ansible.builtin.command: >
        helm repo add prometheus-community
        https://prometheus-community.github.io/helm-charts
      register: prometheus_repo
      changed_when: prometheus_repo.rc == 0
      failed_when: false

    - name: Add Grafana Helm repository
      ansible.builtin.command: >
        helm repo add grafana
        https://grafana.github.io/helm-charts
      register: grafana_repo
      changed_when: grafana_repo.rc == 0
      failed_when: false

    - name: Update Helm repositories
      ansible.builtin.command: helm repo update
      changed_when: false

    - name: Check whether Prometheus is already installed
      ansible.builtin.command: helm status prometheus -n monitoring
      register: prometheus_status
      changed_when: false
      failed_when: false

    - name: Install Prometheus on first run
      ansible.builtin.command: >
        helm install prometheus prometheus-community/prometheus
        --namespace monitoring
      when: prometheus_status.rc != 0

    - name: Check whether Grafana is already installed
      ansible.builtin.command: helm status grafana -n monitoring
      register: grafana_status
      changed_when: false
      failed_when: false

    - name: Install Grafana on first run
      ansible.builtin.command: >
        helm install grafana grafana/grafana
        --namespace monitoring
      when: grafana_status.rc != 0

    - name: Expose Grafana service using kubectl in monitoring namespace
      ansible.builtin.command: kubectl -n monitoring expose service grafana --type=NodePort --target-port=3000 --name=grafana-ext --port=3000
      ignore_errors: true

    # - name: Ensure prometheus service is present and exposed (NodePort)
    #   k8s:
    #     state: present
    #     definition:
    #       apiVersion: v1
    #       kind: Service
    #       metadata:
    #         name: prometheus-server-ext
    #         namespace: monitoring
    #       spec:
    #         selector:
    #           app: prometheus
    #         type: NodePort
    #         ports:
    #           - port: 9090
    #             targetPort: 9090
    #   register: prometheus_svc
    #   failed_when: false

    - name: Ensure grafana service exposed (NodePort)
      k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Service
          metadata:
            name: grafana-ext
            namespace: monitoring
          spec:
            selector:
              app.kubernetes.io/name: grafana
            type: NodePort
            ports:
              - port: 3000
                targetPort: 3000
      failed_when: false
