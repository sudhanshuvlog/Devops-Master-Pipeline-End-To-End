- name: Setup Kubernetes With Common Configurations
  hosts: all
  become: true

  vars:
    kubernetes_version: "v1.36"
    crio_version: "v1.37"
    pod_cidr: "192.168.0.0/16"
    packages:
      - iproute-tc
      - git
      - curl

  tasks:
    - name: Disable swap
      command: swapoff -a
      
    - name: Add swapoff to crontab for reboot
      cron:
        name: "Ensure swapoff -a runs at reboot"
        job: "/sbin/swapoff -a"
        special_time: "reboot"
        state: present

    - name: Install required packages
      dnf:
        name: "{{ packages }}"
        state: present
      when: True

    - name: Update kernel packages
      ansible.builtin.dnf:
        name:
          - kernel
          - kernel-core
          - kernel-modules
          - kernel-modules-core
          - kernel-modules-extra
        state: latest
      become: true
      register: kernel_update
      notify: 
        - Reboot to use the updated kernel

    - name: Verify running kernel
      ansible.builtin.command: uname -r
      register: running_kernel
      changed_when: false

    - name: Display running kernel
      ansible.builtin.debug:
        var: running_kernel.stdout

    - name: Load kernel modules
      modprobe:
        name: "{{ item }}"
      loop:
        - overlay
        - br_netfilter

    - name: Persist kernel modules
      copy:
        dest: /etc/modules-load.d/k8s.conf
        content: |
          overlay
          br_netfilter

    - name: Apply sysctl params
      copy:
        dest: /etc/sysctl.d/k8s.conf
        content: |
          net.bridge.bridge-nf-call-iptables = 1
          net.bridge.bridge-nf-call-ip6tables = 1
          net.ipv4.ip_forward = 1

    - name: Reload sysctl
      command: sysctl --system

    - name: Disable SELinux
      command: setenforce 0
      ignore_errors: true

    - name: Add Kubernetes repo
      copy:
        dest: /etc/yum.repos.d/kubernetes.repo
        content: |
          [kubernetes]
          name=Kubernetes
          baseurl=https://pkgs.k8s.io/core:/stable:/{{ kubernetes_version }}/rpm/
          enabled=1
          gpgcheck=1
          gpgkey=https://pkgs.k8s.io/core:/stable:/{{ kubernetes_version }}/rpm/repodata/repomd.xml.key

    #- name: Install CRI-O repo
    #  ansible.builtin.yum_repository:
    #    name: cri-o
    #    description: CRI-O
    #    baseurl: "https://download.opensuse.org/repositories/isv:/cri-o:/stable:/v1.37/rpm/x86_64/"
    #    enabled: true
        #gpgcheck: false
        #gpgkey: "https://download.opensuse.org/repositories/isv:/cri-o:/stable:/v1.37/rpm/repodata/repomd.xml.key"
    #    state: present

    - command: curl -LO https://download.opensuse.org/repositories/isv:/cri-o:/stable:/v1.37/rpm/x86_64/cri-o-1.37.0-150500.1.1.x86_64.rpm
    - command: dnf install -y cri-o-1.37.0-150500.1.1.x86_64.rpm

    - name: Install Kubernetes
      dnf:
        name:
          - cri-o
          - kubelet
          - kubeadm
          - kubectl
        state: present

    - name: Enable services
      systemd:
        name: "{{ item }}"
        enabled: true
        state: started
      loop:
        - crio
        - kubelet

  handlers:
    - name: Reboot to use the updated kernel
      ansible.builtin.reboot:
        msg: "Rebooting to load the updated kernel"
        reboot_timeout: 600
        post_reboot_delay: 15
      become: true
    
